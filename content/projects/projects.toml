[[project]]
name = "TrueVision"
desc = "**Tech Stack:** FastAPI, PyTorch, CNN, Grad-CAM<br>TrueVision is a full-stack AI web app for detecting AI-generated images using a ResNet18 CNN fine-tuned with transfer learning on 120,000 labeled CIFAKE images, achieving 98.43% validation accuracy across real and AI-generated classes.<br>It includes a responsive React and Tailwind frontend with drag-and-drop upload, a 10 MB file limit, and support for JPEG, PNG, and WebP images.<br>A FastAPI backend serves real-time PyTorch inference through a REST API and integrates Grad-CAM heatmaps to show the image regions driving each prediction."
