[[project]]
name = "ResearchGPT"
desc = "**Tech Stack:** Python, FastAPI, LangChain, FAISS<br>ResearchGPT is an AI-powered Retrieval-Augmented Generation application that processes and queries information from more than 50 research papers, enabling context-aware question answering with semantic search and Google Gemini.<br>Its FastAPI backend accepts PDF uploads and arXiv URLs, extracts text with PyMuPDF, and indexes over 10,000 text chunks in FAISS for efficient similarity search.<br>A hybrid retrieval pipeline combines semantic search, keyword matching, and document-wide sampling to reduce irrelevant retrieval and improve response quality across more than 100 evaluation queries."
